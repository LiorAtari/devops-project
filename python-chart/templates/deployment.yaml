apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "python-chart.fullname" . }}
  labels: 
    {{- include "python-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "python-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "python-chart.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
          - name: DB_HOST
            value: {{ .Values.env.DB_HOST | quote }}
          - name: BACKEND
            value: {{ .Values.env.BACKEND | quote }}
          - name: DB_NAME
            value: {{ .Values.env.DB_NAME | quote }}
          - name: DB_USER
            value: {{ .Values.env.DB_USER | quote }}
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "mysql-secrets"
                key: "mysql-password"