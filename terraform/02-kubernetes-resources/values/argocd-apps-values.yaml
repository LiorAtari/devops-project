applications:
  python-app:
    name: python-app
    namespace: argocd
    project: default
    source:
      repoURL: git@github.com:LiorAtari/devops-project.git
      targetRevision: main
      path: python-chart
    destination:
      server: https://kubernetes.default.svc
      namespace: python-app
    syncPolicy:
      automated:
        prune: true
        selfHeal: true

  mysql:
    name: mysql
    namespace: argocd
    project: default
    source:
      chart: mysql
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 12.0.0
      helm:
        releaseName: mysql
        values: |
          auth:
            existingSecret: "mysql-secrets"
            database: "exampleDb"
            username: "flaskapp"
          initdbScripts:
            init.sql: |
              CREATE DATABASE IF NOT EXISTS `exampleDb`;
              CREATE USER IF NOT EXISTS 'flaskapp'@'%' IDENTIFIED BY 'flaskapp';
              GRANT ALL PRIVILEGES ON `exampleDb` .* TO 'flaskapp'@'%' WITH GRANT OPTION;
              FLUSH PRIVILEGES;

              USE exampleDb;

              CREATE TABLE IF NOT EXISTS `people` (
                `id` int(11) NOT NULL AUTO_INCREMENT,
                `firstname` varchar(100) NOT NULL,
                `lastname` varchar(100) NOT NULL,
                `age` int(11) NOT NULL,
                `address` varchar(100) NOT NULL,
                `workplace` varchar(100) NOT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `id` (`id`)
              ) ENGINE=MyISAM AUTO_INCREMENT=10001;

              INSERT INTO `people` (`firstname`, `lastname`, `age`, `address`, `workplace`) VALUES
              ('John', 'Doe', 30, '123 Main St, New York, NY 10030', 'Google'),
              ('Jane', 'Doe', 28, '123 Main St, New York, NY 10030', 'Microsoft'),
              ('Jack', 'Doe', 25, '123 Main St, New York, NY 10030', 'Amazon');

    destination:
      server: https://kubernetes.default.svc
      namespace: python-app
    syncPolicy:
      automated:
        prune: true
        selfHeal: true