name: Build Application CI
on:
  # Triggers the build when changes pushed to "python-application" folder
  push:
    paths:
      - 'python-application/**'

  # Trigger the build manually
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ''
      
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build, Tag and Push Docker Image
        run: |
          REGISTRY=${{ secrets.DOCKER_USERNAME }}
          DOCKERFILE_PATH=./python-application/Dockerfile
          IMAGE_NAME=develeap-python-app
          VERSION=${{ steps.tag_version.outputs.new_tag }}

          docker build -f ./python-application/Dockerfile -t $REGISTRY/$IMAGE_NAME:$VERSION ./python-application
          docker push $REGISTRY/$IMAGE_NAME:$VERSION

      - name: Update Helm Chart with new version tag
        run: |
          sed -i "s|version: *|version: ${{ env.VERSION }}|g" ./python-chart/Chart.yaml
          sed -i "s|tag: *|tag: ${{ env.VERSION }}|g" ./python-chart/Chart.yaml

      - name: Commit updated Chart tags 
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [[ $(git status --porcelain) ]]; then
            git add ./python-chart
            git commit -m "Updating Helm Chart tag verisons to v${{ env.tag }}"
            git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/LiorAtari/devops-project.git
          else
            echo "No changes to commit"
          fi