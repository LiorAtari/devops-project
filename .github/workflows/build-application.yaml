name: Build Application CI
on:
  # Triggers the build when changes pushed to "python-application" folder
  push:
    paths:
      - 'python-application/**'

  # Trigger the build manually
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: 0.1.0

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build, Tag and Push Docker Image
        run: |
          REGISTRY=${{ secrets.DOCKER_USERNAME }}
          DOCKERFILE_PATH=./python-application/Dockerfile
          IMAGE_NAME=develeap-python-app
          VERSION=${{ steps.semver.outputs.nextStrict}}

          docker build -f ./python-application/Dockerfile -t $REGISTRY/$IMAGE_NAME:$VERSION ./python-application
          docker push $REGISTRY/$IMAGE_NAME:$VERSION
